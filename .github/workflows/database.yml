name: Database

on:
  pull_request:
    branches: [main]
    paths:
      - supabase/**
      - lib/supabase/**
      - lib/auth/**
      - lib/profiles/**
      - lib/catalog/**
      - lib/bookings/**
      - app/api/catalog/**
      - app/api/bookings/**
      - tests/e2e/catalog.py
      - app/(auth)/**
      - app/layout.tsx
      - app/globals.css
      - components/ui/**
      - components/layout/**
      - proxy.ts
      - next.config.ts
      - tests/e2e/auth.py
      - .github/workflows/database.yml
      - .prettierrc.json
      - .node-version
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - supabase/**
      - lib/supabase/**
      - lib/auth/**
      - lib/profiles/**
      - lib/catalog/**
      - lib/bookings/**
      - app/api/catalog/**
      - app/api/bookings/**
      - tests/e2e/catalog.py
      - app/(auth)/**
      - app/layout.tsx
      - app/globals.css
      - components/ui/**
      - components/layout/**
      - proxy.ts
      - next.config.ts
      - tests/e2e/auth.py
      - .github/workflows/database.yml
      - .prettierrc.json
      - .node-version
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Reset, access tests, generated types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned project tooling
        run: npm ci
      - name: Start disposable database and API
        # The CLI's status summary includes local privileged keys; keep it out of logs.
        run: npm run db:start -- --exclude realtime,imgproxy,postgres-meta,studio,logflare,vector,supavisor > /dev/null
      - name: Rebuild from migrations
        run: npm run db:reset
      - name: Check database functions
        run: npm run db:lint
      - name: Test constraints and access boundaries
        run: npm run db:test
      - name: Test booking participant access and concurrent reservations
        run: npm run db:test:bookings
      - name: Test local demo seed, preservation, privacy, and scoped reset
        run: npm run db:demo:test
      - name: Test real HTTP access and Server Component client
        run: npm run db:smoke
      - name: Generate types and check drift
        run: |
          npm run db:types
          git diff --exit-code -- lib/supabase/database.types.ts
      - name: Save generated types
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-types
          path: lib/supabase/database.types.ts
          retention-days: 7
      - name: Install isolated browser test tooling
        run: |
          python3 -m venv /tmp/rentify-auth-python
          /tmp/rentify-auth-python/bin/pip install playwright==1.64.0
          /tmp/rentify-auth-python/bin/python -m playwright install --with-deps chromium
      - name: Build and start the app with disposable local public settings
        run: |
          npm run db:env
          npm run build
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/rentify-auth-next.log 2>&1 &
          echo $! > /tmp/rentify-auth-next.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/rentify-auth-next.log
          exit 1
      - name: Test real signup, verification, refresh, recovery, and permissions
        run: /tmp/rentify-auth-python/bin/python tests/e2e/auth.py
      - name: Test real booking HTTP routes with Auth session cookies
        run: npm run test:bookings:http
      - name: Stop auth journey app
        if: always()
        run: |
          if [ -f /tmp/rentify-auth-next.pid ]; then kill "$(cat /tmp/rentify-auth-next.pid)" || true; fi
      - name: Stop disposable database
        if: always()
        run: npm run db:stop -- --no-backup
