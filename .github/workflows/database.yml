name: Database

on:
  pull_request:
    branches: [main]
    paths:
      - supabase/**
      - lib/supabase/database.types.ts
      - .github/workflows/database.yml
      - .prettierrc.json
      - .node-version
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - supabase/**
      - lib/supabase/database.types.ts
      - .github/workflows/database.yml
      - .prettierrc.json
      - .node-version
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Reset, access tests, generated types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install existing tooling for type formatting
        run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Start disposable database
        run: supabase db start
      - name: Rebuild from migrations
        run: supabase db reset --local --no-seed
      - name: Check database functions
        run: supabase db lint --local --schema public --fail-on warning
      - name: Test constraints and access boundaries
        run: supabase test db --local
      - name: Generate types and check drift
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.raw.types.ts
          ./node_modules/.bin/prettier --config .prettierrc.json --parser typescript < /tmp/database.raw.types.ts > /tmp/database.types.ts
          diff -u lib/supabase/database.types.ts /tmp/database.types.ts
      - name: Save generated types
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-types
          path: /tmp/database.types.ts
          retention-days: 7
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
