# Generated with Supabase CLI 2.121.0; minimal local configuration.
project_id = "rentify-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/callback?next=/update-password",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback?next=/update-password"
]
minimum_password_length = 8

[auth.rate_limit]
# Local email stays in Mailpit. Hosted projects need their own SMTP/rate limits.
email_sent = 30

[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Verify your Rentify email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Rentify password"
content_path = "./supabase/templates/recovery.html"

[analytics]
enabled = false

[edge_runtime]
enabled = false
